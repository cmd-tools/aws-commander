name: amplifybackend
defaultCommand: list-s3-buckets
commands:
- name: list-s3-buckets
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Buckets
  rerunOnBack: false
  favouritable: true
