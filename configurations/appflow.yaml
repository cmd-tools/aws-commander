name: appflow
defaultCommand: list-connector-entities
commands:
- name: list-connector-entities
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: connectorEntityMap
  rerunOnBack: false
  favouritable: true
- name: list-connectors
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: connectors
  rerunOnBack: false
  favouritable: true
- name: list-flows
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: flows
  rerunOnBack: false
  favouritable: true
- name: describe-connector-profiles
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: connectorProfileDetails
  rerunOnBack: false
  favouritable: true
- name: describe-connectors
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: connectors
  rerunOnBack: false
  favouritable: true
