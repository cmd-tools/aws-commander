name: auditmanager
defaultCommand: list-assessment-reports
commands:
- name: list-assessment-reports
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: assessmentReports
  rerunOnBack: false
  favouritable: true
- name: list-assessments
  arguments:
  - --output
  - json
  - --cli-read-timeout
