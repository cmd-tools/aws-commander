name: chime-sdk-identity
defaultCommand: list-app-instances
commands:
- name: list-app-instances
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: AppInstances
  rerunOnBack: false
  favouritable: true
