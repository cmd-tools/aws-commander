name: chime-sdk-messaging
defaultCommand: get-messaging-session-endpoint
commands:
- name: get-messaging-session-endpoint
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Endpoint
  rerunOnBack: false
  favouritable: true
