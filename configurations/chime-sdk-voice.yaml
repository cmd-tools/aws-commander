  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: VoiceConnectors
  rerunOnBack: false
  favouritable: true
- name: list-voice-profile-domains
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: VoiceProfileDomains
  rerunOnBack: false
  favouritable: true
- name: get-global-settings
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: VoiceConnector
  rerunOnBack: false
  favouritable: true
- name: search-available-phone-numbers
  arguments:
