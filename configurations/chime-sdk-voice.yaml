name: chime-sdk-voice
defaultCommand: list-available-voice-connector-regions
commands:
- name: list-available-voice-connector-regions
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: VoiceConnectorRegions
  rerunOnBack: false
  favouritable: true
- name: list-phone-number-orders
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: PhoneNumberOrders
  rerunOnBack: false
  favouritable: true
- name: list-phone-numbers
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: PhoneNumbers
  rerunOnBack: false
  favouritable: true
- name: list-sip-media-applications
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: SipMediaApplications
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
- name: list-sip-rules
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: SipRules
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
- name: list-voice-connector-groups
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: VoiceConnectorGroups
  rerunOnBack: false
  favouritable: true
- name: list-voice-connectors
  arguments:
  - --output
  - json
  - --cli-read-timeout
