name: cloudtrail
defaultCommand: list-channels
commands:
- name: list-trails
  rerunOnBack: false
  favouritable: true
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  parse:
    type: object
    attributeName: Trails
- name: lookup-events
  rerunOnBack: false
  arguments:
  - --max-results
  - '50'
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Events
  pagination:
    enabled: true
    nextTokenParam: --starting-token
    nextTokenJsonPath: NextToken
- name: list-channels
  arguments:
  - --output
