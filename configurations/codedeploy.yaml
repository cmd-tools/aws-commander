  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: nextToken
- name: list-on-premises-instances
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: instanceNames
  rerunOnBack: false
  favouritable: true
  resourceName: instanceName
  pagination:
    enabled: true
    nextTokenParam: --next-token
