name: cognito-sync
defaultCommand: list-identity-pool-usage
commands:
- name: list-identity-pool-usage
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: IdentityPoolUsages
  rerunOnBack: false
  favouritable: true
