name: controlcatalog
defaultCommand: ''
commands:
- name: ListCommonControls
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
