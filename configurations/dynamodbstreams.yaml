name: dynamodbstreams
defaultCommand: list-streams
commands:
- name: list-streams
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Streams
  rerunOnBack: false
  favouritable: true
