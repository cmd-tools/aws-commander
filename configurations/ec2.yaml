name: ec2
defaultCommand: ''
commands:
- name: describe-instances
  rerunOnBack: false
  favouritable: true
  arguments:
  - --query
  - '{Instances: Reservations[].Instances[]}'
  - --no-paginate
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Instances
