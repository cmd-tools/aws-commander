name: ecr
defaultCommand: list-pull-time-update-exclusions
commands:
- name: list-pull-time-update-exclusions
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: pullTimeUpdateExclusions
  rerunOnBack: false
  favouritable: true
- name: describe-pull-through-cache-rules
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: pullThroughCacheRules
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: nextToken
