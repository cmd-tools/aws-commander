name: eks
defaultCommand: list-clusters
commands:
- name: list-clusters
  resourceName: clusterName
  rerunOnBack: false
  favouritable: true
  arguments:
  - --no-paginate
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  parse:
    type: list
    attributeName: clusters
- name: list-nodegroups
  depends_on: list-clusters
  rerunOnBack: false
