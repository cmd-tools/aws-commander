name: emr
defaultCommand: list-clusters
commands:
- name: list-clusters
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Clusters
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: Marker
