name: guardduty
defaultCommand: list-detectors
commands:
- name: list-detectors
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: DetectorIds
  rerunOnBack: false
  favouritable: true
  resourceName: DetectorId
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
