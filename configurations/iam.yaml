- name: list-users
  resourceName: UserName
  rerunOnBack: false
  favouritable: true
  arguments:
  - --no-paginate
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  parse:
    type: object
    attributeName: Users
