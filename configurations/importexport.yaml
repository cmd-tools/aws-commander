name: importexport
defaultCommand: list-jobs
commands:
- name: list-jobs
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Jobs
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: Jobs[-1].JobId
