name: kendra-ranking
defaultCommand: list-rescore-execution-plans
commands:
- name: list-rescore-execution-plans
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: SummaryItems
  rerunOnBack: false
  favouritable: true
