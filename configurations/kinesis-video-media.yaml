name: kinesis-video-media
defaultCommand: ''
commands:
- name: GetMedia
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Kinesis-Video-Media
  rerunOnBack: false
  favouritable: true
