name: kinesis
defaultCommand: list-shards
commands:
- name: list-shards
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Shards
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
- name: list-streams
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: StreamNames
  rerunOnBack: false
  favouritable: true
  resourceName: StreamName
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
- name: list-tags-for-stream
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Tags
  rerunOnBack: false
  favouritable: true
- name: describe-account-settings
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: MinimumThroughputBillingCommitment
  rerunOnBack: false
  favouritable: true
- name: describe-stream
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: StreamDescription
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --exclusive-start-shard-id
    nextTokenJsonPath: StreamDescription.Shards[-1].ShardId
- name: describe-stream-consumer
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ConsumerDescription
  rerunOnBack: false
  favouritable: true
- name: describe-stream-summary
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: StreamDescriptionSummary
  rerunOnBack: false
  favouritable: true
