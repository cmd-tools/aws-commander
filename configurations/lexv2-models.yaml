  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: testExecutions
  rerunOnBack: false
  favouritable: true
- name: list-test-sets
  arguments:
