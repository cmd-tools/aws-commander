name: license-manager
defaultCommand: list-distributed-grants
commands:
- name: list-distributed-grants
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Grants
  rerunOnBack: false
  favouritable: true
