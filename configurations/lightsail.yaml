name: lightsail
defaultCommand: get-active-names
commands:
- name: get-active-names
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: activeNames
  rerunOnBack: false
