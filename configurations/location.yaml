name: location
defaultCommand: list-geofence-collections
commands:
- name: list-geofence-collections
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Entries
  rerunOnBack: false
