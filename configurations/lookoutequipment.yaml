name: lookoutequipment
defaultCommand: list-data-ingestion-jobs
commands:
- name: list-data-ingestion-jobs
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: DataIngestionJobSummaries
  rerunOnBack: false
  favouritable: true
