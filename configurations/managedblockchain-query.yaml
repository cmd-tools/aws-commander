name: managedblockchain-query
defaultCommand: ''
commands:
- name: batch-get-token-balance
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: tokenBalances
  rerunOnBack: false
  favouritable: true
