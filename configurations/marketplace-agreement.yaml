name: marketplace-agreement
defaultCommand: ''
commands:
- name: search-agreements
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: agreementViewSummaries
  rerunOnBack: false
  favouritable: true
