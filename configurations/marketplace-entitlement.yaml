name: marketplace-entitlement
defaultCommand: ''
commands:
- name: GetEntitlements
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Marketplace-Entitlement
  rerunOnBack: false
  favouritable: true
