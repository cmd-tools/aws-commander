name: marketplace-reporting
defaultCommand: ''
commands:
- name: GetBuyerDashboard
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Marketplace-Reporting
  rerunOnBack: false
  favouritable: true
