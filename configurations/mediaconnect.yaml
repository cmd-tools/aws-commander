name: mediaconnect
defaultCommand: list-bridges
commands:
- name: list-bridges
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Bridges
  rerunOnBack: false
