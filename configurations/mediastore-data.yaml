name: mediastore-data
defaultCommand: ''
commands:
- name: ListItems
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: item
  rerunOnBack: false
  favouritable: true
- name: DescribeObject
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Mediastore-Data
  rerunOnBack: false
  favouritable: true
- name: GetObject
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Mediastore-Data
  rerunOnBack: false
  favouritable: true
