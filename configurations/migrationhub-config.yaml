name: migrationhub-config
defaultCommand: describe-home-region-controls
commands:
- name: describe-home-region-controls
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: HomeRegionControls
  rerunOnBack: false
  favouritable: true
