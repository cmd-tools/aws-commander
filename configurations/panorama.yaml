name: panorama
defaultCommand: list-application-instances
commands:
- name: list-application-instances
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ApplicationInstances
  rerunOnBack: false
  favouritable: true
