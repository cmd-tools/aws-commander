name: pinpoint-sms-voice
defaultCommand: list-configuration-sets
commands:
- name: list-configuration-sets
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: ConfigurationSets
  rerunOnBack: false
  favouritable: true
