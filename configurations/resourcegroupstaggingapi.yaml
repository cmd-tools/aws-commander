name: resourcegroupstaggingapi
defaultCommand: list-required-tags
commands:
- name: list-required-tags
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: RequiredTags
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
- name: get-compliance-summary
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: SummaryList
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --pagination-token
    nextTokenJsonPath: PaginationToken
- name: get-resources
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ResourceTagMappingList
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --pagination-token
    nextTokenJsonPath: PaginationToken
- name: get-tag-keys
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: TagKeys
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --pagination-token
    nextTokenJsonPath: PaginationToken
