name: route53-recovery-cluster
defaultCommand: ''
commands:
- name: ListRoutingControls
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: routingcontrol
  rerunOnBack: false
  favouritable: true
- name: GetRoutingControlState
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Route53-Recovery-Cluster
  rerunOnBack: false
  favouritable: true
