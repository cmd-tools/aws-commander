    attributeName: Operations
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: NextPageMarker
- name: list-prices
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Prices
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: NextPageMarker
- name: view-billing
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: BillingRecords
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: NextPageMarker
