name: s3
defaultCommand: list-buckets
commands:
- name: list-buckets
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Buckets
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --continuation-token
    nextTokenJsonPath: ContinuationToken
- name: list-directory-buckets
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Buckets
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --continuation-token
    nextTokenJsonPath: ContinuationToken
