name: "s3api"
defaultCommand: "list-buckets"
commands:
  - name: "list-buckets"
    defaultCommand: list-objects-v2
    resourceName: bucket
    arguments:
      - "--no-paginate"
      - "--output"
      - "json"
      - "--cli-read-timeout"
      - "2"
      - "--cli-connect-timeout"
      - "5"
    view: tableView
    parse:
      type: "object"
      attributeName: "Buckets"
  - name: "list-objects-v2"
    depends_on: "list-buckets"
    resourceName: object
    actions:
      - type: "download"
        rune: "d"
        description: "Download"
        targetCommand: "get-object"
    arguments:
      - "--bucket"
      - "$BUCKET"
      - "--no-paginate"
      - "--output"
      - "json"
      - "--cli-read-timeout"
      - "2"
      - "--cli-connect-timeout"
      - "5"
    view: tableView
    parse:
      type: "object"
      attributeName: "Contents"
  - name: "get-object"
    depends_on: "list-objects-v2"
    arguments:
      - "--bucket"
      - "$BUCKET"
      - "--key"
      - "$OBJECT"
      - "--cli-read-timeout"
      - "10"
      - "--cli-connect-timeout"
      - "5"
    view: contentView
