name: sdb
defaultCommand: list-domains
commands:
- name: list-domains
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: list
    attributeName: DomainNames
  rerunOnBack: false
  favouritable: true
  resourceName: DomainName
  pagination:
    enabled: true
    nextTokenParam: --next-token
    nextTokenJsonPath: NextToken
