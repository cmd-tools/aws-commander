name: serverlessrepo
defaultCommand: ''
commands:
- name: ListApplicationDependencies
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: applicationdependencie
  rerunOnBack: false
  favouritable: true
