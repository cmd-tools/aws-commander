name: servicecatalog
defaultCommand: list-accepted-portfolio-shares
commands:
- name: list-accepted-portfolio-shares
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: PortfolioDetails
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --page-token
    nextTokenJsonPath: NextPageToken
