name: signer-data
defaultCommand: ''
commands:
- name: GetRevocationStatus
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Signer-Data
  rerunOnBack: false
  favouritable: true
