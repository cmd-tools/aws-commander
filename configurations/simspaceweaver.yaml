name: simspaceweaver
defaultCommand: list-simulations
commands:
- name: list-simulations
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Simulations
  rerunOnBack: false
  favouritable: true
