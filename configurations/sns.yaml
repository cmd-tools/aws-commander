name: "sns"
defaultCommand: "list-topics"
commands:
  - name: "list-topics"
    resourceName: topicArn
    rerunOnBack: false
    favouritable: true
    arguments:
      - "--output"
      - "json"
      - "--cli-read-timeout"
      - "10"
      - "--cli-connect-timeout"
      - "5"
    view: tableView
    parse:
      type: "object"
      attributeName: "Topics"
    pagination:
      enabled: true
      nextTokenParam: "--next-token"
      nextTokenJsonPath: "NextToken"
  - name: "list-subscriptions-by-topic"
    depends_on: "list-topics"
    resourceName: subscriptionArn
    rerunOnBack: false
    arguments:
      - "--topic-arn"
      - "$TOPICARN"
      - "--output"
      - "json"
      - "--cli-read-timeout"
      - "10"
      - "--cli-connect-timeout"
      - "5"
    view: tableView
    showJsonViewer: true
    parse:
      type: "object"
      attributeName: "Subscriptions"
    pagination:
      enabled: true
      nextTokenParam: "--next-token"
      nextTokenJsonPath: "NextToken"
  - name: "get-topic-attributes"
    depends_on: "list-topics"
    rerunOnBack: false
    arguments:
      - "--topic-arn"
      - "$TOPICARN"
      - "--output"
      - "json"
      - "--cli-read-timeout"
      - "10"
      - "--cli-connect-timeout"
      - "5"
    view: tableView
    showJsonViewer: true
    parse:
      type: "keys"
      attributeName: "Attributes"
  - name: "get-subscription-attributes"
    depends_on: "list-subscriptions-by-topic"
    rerunOnBack: false
    arguments:
      - "--subscription-arn"
      - "$SUBSCRIPTIONARN"
      - "--output"
      - "json"
      - "--cli-read-timeout"
      - "10"
      - "--cli-connect-timeout"
      - "5"
    view: tableView
    showJsonViewer: true
    parse:
      type: "keys"
      attributeName: "Attributes"
