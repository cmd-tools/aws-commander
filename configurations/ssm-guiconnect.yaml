name: ssm-guiconnect
defaultCommand: get-connection-recording-preferences
commands:
- name: get-connection-recording-preferences
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ConnectionRecordingPreferences
  rerunOnBack: false
  favouritable: true
