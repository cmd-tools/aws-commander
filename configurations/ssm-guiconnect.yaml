name: ssm-guiconnect
defaultCommand: ''
commands:
- name: GetConnectionRecordingPreferences
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Ssm-Guiconnect
  rerunOnBack: false
  favouritable: true
