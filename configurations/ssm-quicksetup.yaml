name: ssm-quicksetup
defaultCommand: list-configuration-managers
commands:
- name: list-configuration-managers
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ConfigurationManagersList
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --starting-token
    nextTokenJsonPath: NextToken
- name: list-configurations
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ConfigurationsList
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --starting-token
    nextTokenJsonPath: NextToken
- name: list-quick-setup-types
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: QuickSetupTypeList
  rerunOnBack: false
  favouritable: true
- name: get-service-settings
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: ServiceSettings
  rerunOnBack: false
  favouritable: true
