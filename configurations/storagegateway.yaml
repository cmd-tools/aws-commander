name: storagegateway
defaultCommand: list-automatic-tape-creation-policies
commands:
- name: list-automatic-tape-creation-policies
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: AutomaticTapeCreationPolicyInfos
  rerunOnBack: false
  favouritable: true
- name: list-cache-reports
