name: sts
defaultCommand: get-session-token
commands:
- name: get-session-token
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Credentials
  rerunOnBack: false
  favouritable: true
