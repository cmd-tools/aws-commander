name: support-app
defaultCommand: ''
commands:
- name: ListSlackChannelConfigurations
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: slackchannelconfiguration
  rerunOnBack: false
  favouritable: true
- name: ListSlackWorkspaceConfigurations
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
