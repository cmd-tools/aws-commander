name: timestream-write
defaultCommand: list-batch-load-tasks
commands:
- name: list-batch-load-tasks
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: BatchLoadTasks
  rerunOnBack: false
  favouritable: true
- name: list-databases
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Databases
  rerunOnBack: false
  favouritable: true
- name: list-tables
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Tables
  rerunOnBack: false
  favouritable: true
- name: describe-endpoints
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Endpoints
  rerunOnBack: false
  favouritable: true
