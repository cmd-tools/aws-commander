name: wellarchitected
defaultCommand: list-lenses
commands:
- name: list-lenses
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: LensSummaries
  rerunOnBack: false
  favouritable: true
