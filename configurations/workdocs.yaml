name: workdocs
defaultCommand: describe-activities
commands:
- name: describe-activities
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: UserActivities
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: Marker
- name: describe-users
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Users
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: Marker
- name: get-resources
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Folders
  rerunOnBack: false
  favouritable: true
- name: initiate-document-version-upload
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Metadata
  rerunOnBack: false
  favouritable: true
- name: search-resources
  arguments:
  - --output
  - json
  - --cli-read-timeout
  - '10'
  - --cli-connect-timeout
  - '5'
  view: tableView
  showJsonViewer: true
  parse:
    type: object
    attributeName: Items
  rerunOnBack: false
  favouritable: true
  pagination:
    enabled: true
    nextTokenParam: --marker
    nextTokenJsonPath: Marker
